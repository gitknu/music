<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Захист від помилок блокування YouTube-плеєра -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Музика 🎵</title>
  <!-- Шрифт Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Скрипт іконок Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Декоративні змінні світлого корпоративного стилю */
    :root {
      --primary-red: #b80000;
      --primary-red-hover: #900000;
      --bg-light: #fbfbfc;       /* Світле тло сторінки */
      --bg-card: #ffffff;       /* Білі картки */
      --border-color: #e2e8f0;  /* М'яка сіра межа */
      --text-main: #0f172a;     /* Контрастний темно-синій */
      --text-muted: #64748b;    /* Сірий для другорядних елементів */
      --accent-blue: #2563eb;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }
    /* Індикатор прогресу прокрутки вгорі сторінки */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-red), var(--accent-blue));
      width: 0%;
      z-index: 1000;
      transition: width 0.1s ease;
    }
    /* Шапка сайту з більш компактними вертикальними розмірами */
    header {
      padding: 60px 20px 40px;
      text-align: center;
      position: relative;
      background: radial-gradient(circle at top, rgba(184, 0, 0, 0.04) 0%, transparent 70%);
      border-bottom: 1px solid var(--border-color);
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
      color: var(--text-main);
    }
    .subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 650px;
      margin: 0 auto 35px;
      font-weight: 400;
    }
    /* Головний пошук */
    .search-container {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
      z-index: 10;
    }
    .search-input {
      width: 100%;
      padding: 18px 20px 18px 55px;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 50px;
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary-red);
      box-shadow: 0 0 0 4px rgba(184, 0, 0, 0.08), 0 8px 25px rgba(0, 0, 0, 0.05);
    }
    .search-icon {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    /* Панель статистики */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 35px auto 0;
      max-width: 800px;
      flex-wrap: wrap;
    }
    .stat-item {
      background: #ffffff;
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .stat-item strong {
      color: var(--text-main);
      font-weight: 700;
    }
    /* Контейнер таймлайну */
    .timeline-container {
      position: relative;
      max-width: 1350px;
      margin: 50px auto;
      padding: 0 20px 200px;
    }
    /* Центральна лінія таймлайну (під низом) */
    .timeline-container::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(to bottom, 
        rgba(184, 0, 0, 0) 0%, 
        var(--primary-red) 10%, 
        var(--primary-red) 90%, 
        rgba(184, 0, 0, 0) 100%
      );
      transform: translateX(-50%);
      z-index: 1; /* Рівень під маркерами */
    }
    /* Рядок таймлайну (stretch з компактнішими вертикальними відступами на десктопі) */
    .timeline-item {
      display: flex;
      width: 100%;
      margin-bottom: 130px; 
      justify-content: space-between;
      align-items: stretch; /* Рівна висота блоків */
      position: relative;
    }
    /* Ліва та права сторони */
    .timeline-side {
      width: calc(50% - 100px); 
      z-index: 5;
    }
    /* Центральний маркер епохи */
    .timeline-marker {
      width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 9999 !important; /* Розташований вище за лінію таймлайну */
      flex-shrink: 0;
      text-align: center;
      padding: 15px 0;
    }
    /* Іконка в центрі (Z-index 9999 + суцільне біле тло) */
    .timeline-dot {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: #ffffff !important; /* Надійний непрозорий фон */
      border: 3px solid var(--primary-red) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: var(--primary-red);
      box-shadow: 0 4px 15px rgba(184, 0, 0, 0.16) !important; /* Помітна тінь */
      z-index: 9999 !important;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      flex-shrink: 0;
    }
    /* Гарантуємо ідеальне центрування та збереження розмірів SVG-іконок */
    .timeline-dot i, .timeline-dot svg {
      width: 18px !important;
      height: 18px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .timeline-item.active .timeline-dot {
      background-color: var(--primary-red) !important;
      color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 25px rgba(184, 0, 0, 0.45) !important;
    }
    /* Назва року на таймлайні (Z-index 9999 + суцільне тло) */
    .timeline-period-label {
      background-color: #ffffff !important; /* Надійний непрозорий фон */
      padding: 8px 16px;
      border: 2px solid var(--primary-red) !important;
      border-radius: 12px;
      margin-top: 12px;
      line-height: 1.4;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(184, 0, 0, 0.14) !important; /* Контрастна тінь */
      text-align: center;
      z-index: 9999 !important;
    }
    /* Типографіка внутрішніх елементів періоду */
    .period-year {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary-red);
      display: inline-block;
    }
    .period-half {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      display: inline-block;
      margin-top: 2px;
    }
    /* ДИЗАЙН КЛІКАБЕЛЬНОЇ КАРТКИ ОПИСУ */
    .event-card-link {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--primary-red);
      padding: 20px; /* Злегка зменшений відступ для компактності */
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      height: 100%; /* Розтягується на висоту stretched-контейнера */
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04) !important; /* Більш помітна та естетична тінь */
    }
    /* Запобігання рожевому кольору при наведенні та затемнення лівої лінії */
    .event-card-link:not(.empty):hover {
      background-color: #ffffff;
      border-color: var(--border-color);
      border-left-color: var(--primary-red-hover) !important;
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(184, 0, 0, 0.15), 0 4px 12px rgba(0, 0, 0, 0.06) !important;
    }
    .event-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary-red);
      font-weight: 700;
      font-size: 1.25rem;
      margin-bottom: 12px;
    }
    .event-card-header i {
      width: 18px;
      height: 18px;
    }
    .event-card-text {
      font-size: 1.25rem; /* Оптимізований розмір шрифту замість завеликого 1.55rem */
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .event-card-text.italic {
      font-style: italic;
      color: var(--text-muted);
      font-weight: 400;
    }
    .event-card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-muted);
      transition: color 0.2s ease;
      margin-top: auto; 
    }
    .event-card-link:hover .event-card-footer {
      color: var(--primary-red);
    }
    .event-card-footer i {
      width: 14px;
      height: 14px;
    }
    .event-card-link.empty {
      background: #fbfbfc !important;
      border: 1px dashed var(--border-color) !important;
      border-left: 5px solid var(--border-color) !important;
      cursor: default;
      box-shadow: none !important;
    }
    /* СПИСОК ВІДЕО */
    .timeline-videos-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      height: 100%; 
    }
    /* Горизонтальна відеокартка з прев'ю */
    .video-card {
      display: flex;
      flex-direction: column; 
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      width: 100%;
      flex: 1; /* Розподіл висоти */
      text-decoration: none;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.03) !important; /* Помітна тінь */
    }
    .video-card-link:hover {
      border-color: rgba(184, 0, 0, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(184, 0, 0, 0.12), 0 4px 10px rgba(0, 0, 0, 0.03) !important;
    }
    /* Обгортка зображення-прев'ю з збереженням пропорцій */
    .video-thumbnail-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Зображення прев'ю */
    .video-preview-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .video-card-link:hover .video-preview-image {
      transform: scale(1.05);
    }
    /* Естетичний Play Overlay поверх картинки */
    .video-play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }
    .video-card-link:hover .video-play-overlay {
      background: rgba(0, 0, 0, 0.4);
    }
    .play-icon-overlay {
      width: 44px;
      height: 44px;
      background: var(--primary-red);
      color: #ffffff;
      border-radius: 50%;
      padding: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(184, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease;
    }
    .video-card-link:hover .play-icon-overlay {
      transform: scale(1.12);
      background: var(--primary-red-hover);
    }
    /* Опис відео */
    .video-details {
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .video-name {
      font-size: 1.10rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
    }
    .video-year {
      display: block;
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }
    /* Заглушки */
    .empty-video {
      background: #fdfdfd !important;
      border: 1px dashed var(--border-color) !important;
      box-shadow: none !important;
    }
    .empty-video .video-thumbnail-wrapper {
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-video .video-details {
      background: #fdfdfd;
    }
    .empty-video .video-details span {
      color: var(--text-muted) !important;
      font-style: italic;
    }
    /* ПЛАВАЮЧА ПАНЕЛЬ КЕРУВАННЯ */
    .floating-controls-panel {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
      background: #ffffff; /* Повністю білий фон для уникнення перешкод з таймлайном */
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12) !important; /* Сильна тінь */
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      visibility: hidden;
    }
    .floating-controls-panel.visible {
      opacity: 1;
      visibility: visible;
    }
    .floating-search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .floating-search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .floating-search-input {
      border: 1px solid var(--border-color);
      background: #ffffff;
      padding: 8px 16px 8px 38px;
      border-radius: 30px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      color: var(--text-main);
      width: 250px;
      transition: all 0.3s ease;
    }
    .floating-search-input:focus {
      outline: none;
      border-color: var(--primary-red);
      width: 300px;
      box-shadow: 0 0 0 3px rgba(184, 0, 0, 0.08);
    }
    .back-to-top {
      background-color: var(--primary-red);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(184, 0, 0, 0.15);
      flex-shrink: 0;
    }
    .back-to-top:hover {
      background-color: var(--primary-red-hover);
      transform: translateY(-2px);
    }
    .back-to-top i {
      width: 16px;
      height: 16px;
    }
    /* АНІМАЦІЯ «ВИХІД ІЗ ТУМАНУ» */
    /* Анімуємо лише бічні елементи, щоб центральний маркер року залишався статичним та завжди непрозорим */
    .reveal .timeline-side {
      opacity: 0.08; 
      filter: blur(8px); 
      transform: translateY(60px) scale(0.96);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .reveal.active .timeline-side {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    /* ОПТИМІЗАЦІЯ ТА АДАПТИВНІСТЬ ДЛЯ СЕРЕДНІХ ЕКРАНІВ (ПЛАНШЕТИ) */
    @media (max-width: 992px) {
      .timeline-container::before {
        left: 50%;
        transform: translateX(-50%);
        width: 3px;
      }
      .timeline-item {
        display: flex !important;
        flex-direction: row !important; /* Збереження двосторонньої структури */
        align-items: stretch !important;
        margin-bottom: 120px;
        padding-left: 0 !important;
      }
      .timeline-side {
        width: calc(50% - 50px) !important; /* Оптимальний розподіл простору */
        height: auto !important;
      }
      .timeline-marker {
        width: 80px !important;
        position: relative !important;
        left: auto !important;
        top: auto !important;
      }
      .timeline-dot {
        width: 36px !important;
        height: 36px !important;
      }
      .timeline-period-label {
        padding: 5px 10px !important;
        margin-top: 8px !important;
      }
      .period-year {
        font-size: 0.9rem !important;
      }
      .period-half {
        font-size: 0.62rem !important;
      }
      .event-card-link {
        padding: 16px !important;
      }
      .event-card-text {
        font-size: 1.15rem !important;
        margin-bottom: 12px;
      }
      .event-card-header {
        font-size: 1rem !important;
        margin-bottom: 8px;
      }
      .event-card-footer {
        font-size: 0.85rem !important;
      }
      .video-card {
        padding: 8px !important;
      }
      .video-name {
        font-size: 0.95rem !important;
      }
      .video-year {
        font-size: 0.85rem !important;
      }
      .play-icon-overlay {
        width: 36px !important;
        height: 36px !important;
        padding: 8px !important;
      }
    }
    /* ПОВНА АДАПТИВНІСТЬ ДЛЯ МОБІЛЬНИХ ПРИСТРОЇВ (Збереження двосторонньої структури) */
    @media (max-width: 576px) {
      .timeline-item {
        margin-bottom: 110px !important; /* Створює ритм «один блок на скрол» */
      }
      .timeline-side {
        width: calc(50% - 32px) !important; /* Максимальне розширення бічних колонок */
      }
      .timeline-marker {
        width: 54px !important; /* Компактна центральна вісь */
      }
      .timeline-dot {
        width: 28px !important;
        height: 28px !important;
        border-width: 2px !important;
      }
      /* Ідеальне центрування іконки музики у червоному колі на мобільних */
      .timeline-dot i, .timeline-dot svg {
        width: 13px !important;
        height: 13px !important;
      }
      .timeline-period-label {
        padding: 3px 6px !important;
        margin-top: 6px !important;
        border-width: 1.5px !important;
        border-radius: 8px !important;
      }
      .period-year {
        font-size: 0.78rem !important;
      }
      .period-half {
        font-size: 0.58rem !important;
      }
      .event-card-link {
        padding: 10px !important;
        border-left-width: 3px !important;
        border-radius: 10px !important;
      }
      .event-card-header {
        font-size: 0.8rem !important;
        gap: 6px !important;
        margin-bottom: 6px;
      }
      .event-card-header i {
        width: 12px !important;
        height: 12px !important;
      }
      .event-card-text {
        font-size: 0.85rem !important; /* Легкочитний розмір тексту події на мобільних */
        margin-bottom: 8px;
      }
      .event-card-footer {
        font-size: 0.75rem !important;
        gap: 4px !important;
      }
      .event-card-footer i {
        width: 10px !important;
        height: 10px !important;
      }
      .video-card {
        padding: 5px !important;
        border-radius: 10px !important;
      }
      .video-thumbnail-wrapper {
        border-radius: 6px !important;
      }
      .video-details {
        padding-top: 6px !important;
      }
      .video-name {
        font-size: 0.8rem !important;
        line-height: 1.2 !important;
      }
      .video-year {
        font-size: 0.75rem !important;
        margin-top: 2px !important;
      }
      .play-icon-overlay {
        width: 26px !important;
        height: 26px !important;
        padding: 6px !important;
      }
      header {
        padding: 50px 15px 30px !important;
      }
      h1 {
        font-size: 1.8rem !important;
      }
      .subtitle {
        font-size: 0.95rem !important;
        margin-bottom: 20px !important;
      }
      .stats-bar {

    const timelineItemsContainer = document.getElementById('timelineItems');
    const searchInput = document.getElementById('searchInput');
    const floatingSearchInput = document.getElementById('floatingSearchInput');
    const backToTopBtn = document.getElementById('backToTopBtn');
    const floatingControls = document.getElementById('floatingControls');
    /**
     * Повертає хронологічний числовий рейтинг для сортування за зростанням
     */
    function getChronologicalScore(periodStr) {
      const yearMatch = periodStr.match(/(\d{4})/);
      const baseYear = yearMatch ? parseInt(yearMatch[1], 10) : 0;
      let halfScore = 1;
      if (periodStr.includes("2 пол")) {
        halfScore = 2;
      }
      return baseYear * 10 + halfScore;
    }
    /**
     * Створює диференційовану розмітку з роком та половиною періоду
     */
    function formatPeriod(period) {
      return period.replace(/^(.*?), (1|2) пол\.$/, "<span class='period-year'>$1</span><br><span class='period-half'>$2 половина</span>");
    }
    /**
     * Побудова таймлайну
     */
    function renderTimeline(data) {
      timelineItemsContainer.innerHTML = '';
      if (data.length === 0) {
        timelineItemsContainer.innerHTML = `
          <div class="no-results">
            <i data-lucide="search-x" style="width: 48px; height: 48px;"></i>
            <h3>Нічого не знайдено</h3>
          </div>
        `;
        lucide.createIcons();
        return;
      }
      data.forEach((item, index) => {
        const hasEvent = item.event && item.event !== '?';
        // 1. Блок опису (Основна подія)
        let eventHtml = '';
        if (hasEvent) {
          const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(item.event)}`;

              </div>

          `;
        } else {

            <div class="event-card-link empty">
              <div class="event-card-header">
                <i data-lucide="help-circle"></i>
                <span>Основні події</span>
              </div>
              <p class="event-card-text italic">Опис відсутній</p>
            </div>
          `;
        }
        // 2. Блок відео-прев'ю (Переспрямовує на YouTube)
        let videosHtml = `
          <div class="timeline-videos-list">
        `;
        item.videos.forEach(video => {
          if (video.id && video.id !== '???') {
            videosHtml += `
              <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank" class="video-card video-card-link" title="Дивитися на YouTube">
                <div class="video-thumbnail-wrapper">
                  <img class="video-preview-image" src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}">
                  <div class="video-play-overlay">
                    <i data-lucide="play" class="play-icon-overlay"></i>
                  </div>
                </div>
                <div class="video-details">
                  <span class="video-name">${video.title}</span>
                  <span class="video-year">${video.year ? video.year : ''}</span>
                </div>
              </a>
            `;
          } else {
            videosHtml += `
              <div class="video-card empty-video">
                <div class="video-thumbnail-wrapper">
                  <i data-lucide="music-2" style="color: var(--text-muted); opacity: 0.3; width: 28px; height: 28px;"></i>

          rightContent = `<div class="timeline-side right-side event-side">${eventHtml}</div>`;

          leftContent = `<div class="timeline-side left-side event-side">${eventHtml}</div>`;
          rightContent = `<div class="timeline-side right-side videos-side">${videosHtml}</div>`;
        }
        const itemHtml = `
          <div class="timeline-item reveal" id="epoch-row-${index}">
            <!-- Ліва сторона -->

              <div class="timeline-period-label">${formatPeriod(item.period)}</div>
            </div>
            <!-- Права сторона -->
            ${rightContent}
          </div>
        `;
        timelineItemsContainer.insertAdjacentHTML('beforeend', itemHtml);
      });
      lucide.createIcons();
      initScrollReveal();
    }
    /**
     * Анімація виходу з туману (Focus-Mist Reveal)
     */
    function initScrollReveal() {
      const revealElements = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('active');
          } else {
            entry.target.classList.remove('active');
          }
        });
      }, {
        threshold: 0.15,
        rootMargin: "-10% 0px -10% 0px"
      });
      revealElements.forEach(el => observer.observe(el));
    }
    function calculateStats() {
      document.getElementById('totalPeriods').innerText = timelineData.length;
      let totalV = 0;
      timelineData.forEach(item => {
        item.videos.forEach(v => {
          if (v.id && v.id !== '???') totalV++;
        });
      });
      document.getElementById('totalVideos').innerText = totalV;
    }
    /**
     * Синхронізована фільтрація
     */
    function syncAndFilter(value) {
      searchInput.value = value;
      floatingSearchInput.value = value;
      const term = value.toLowerCase().trim();
      if (!term) {
        renderTimeline(timelineData);
        return;
      }
      const filtered = timelineData.filter(item => {
        const matchPeriod = item.period.toLowerCase().includes(term);
        const matchEvent = item.event.toLowerCase().includes(term);
        const matchSongs = item.videos.some(v => 
          v.title.toLowerCase().includes(term) || v.year.toString().includes(term)
        );
        return matchPeriod || matchEvent || matchSongs;
      });
      renderTimeline(filtered);
    }
    searchInput.addEventListener('input', (e) => syncAndFilter(e.target.value));
    floatingSearchInput.addEventListener('input', (e) => syncAndFilter(e.target.value));
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      document.getElementById('progress-bar').style.width = scrolled + '%';
      if (winScroll > 350) {
        floatingControls.classList.add('visible');
      } else {
        floatingControls.classList.remove('visible');
      }
    });
    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
    document.addEventListener('DOMContentLoaded', () => {
      // Автоматичне хронологічне сортування від найдавніших (вгорі) до найновіших (внизу)
      timelineData.sort((a, b) => getChronologicalScore(a.period) - getChronologicalScore(b.period));
      renderTimeline(timelineData);
      calculateStats();
    });
